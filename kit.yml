# What an application takes from shimmer-kit, and how. Read by `skillctl.sh kit …`
# (the skill-manager skill in github.com/Thernal/knowledge), which parses it with
# sed and awk — so keep to this shape: `key: value` scalars, `key:` followed by
# `  - item` lines, `#` comments. No nesting, no quoting, no inline lists.
# Without skill-manager: README.md → Installing → "Without it" copies and renames by hand.

name: shimmer-kit

# Rename points, applied to every file taken from here, code and skill alike.
package: io.thernal.shimmerkit
module: :shimmer
alias: shimmerkit

# Copied into the application and merged on update. The sample is not.
code:
  - shimmer/api
  - shimmer/sweep
  - shimmer/glow

# What an app takes by name (`kit install … --with sweep,glow`, later `kit select`). The api is always
# taken and draws a plain fill on its own, so an app may take no effect and write its own.
feature:
  - sweep  shimmer/sweep  default — a tilted highlight band travelling across the placeholder
  - glow   shimmer/glow — a soft highlight breathing out from the placeholder's centre

# The public contract — its source, not its README.
surface:
  - shimmer/api/src
  - shimmer/sweep/src/commonMain
  - shimmer/glow/src/commonMain

# Installed into the application's skills directory, renamed like the code.
skill:
  - skills/shimmer-kit

# Never copied. A change here is announced on update and read in place.
docs:
  - README.md
  - shimmer/README.md
  - shimmer/api/README.md
  - docs

# What the copied modules expect the application to provide.
requires:
  - plugin <alias>.kmp.library — Kotlin Multiplatform library (build-logic/convention: KmpLibraryConventionPlugin)
  - plugin <alias>.compose — kmp.library + Compose Multiplatform, runtime/foundation/ui as implementation (build-logic/convention: ComposeConventionPlugin)
  - targets android, iosArm64, iosSimulatorArm64 — the same set as the other kits
  - catalog compose-runtime, compose-foundation, compose-ui, compose-animation-core (compose-multiplatform = 1.12.0), kotlin-test
  - root the app's root composes ShimmerHost(effect = …, style = …) once, above everything that shimmers — it drives the one synced sweep and hands every placeholder its effect and look
  - styles the app maps its design system's tokens onto ShimmerStyle in one file of its own design-system module; the kit's defaults are neutral fallbacks for previews and tests, and kit code is never edited to restyle
  - [sweep] the root passes SweepShimmerEffect() (or one with its own band) as ShimmerHost's effect
  - [glow] the root, or a ShimmerLayout around one screen, passes GlowShimmerEffect()
  - settings enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS"), and each code part included as a module
